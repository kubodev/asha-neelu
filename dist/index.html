<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8f4" />
    <title>Malkapuram · Village Atlas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brandmark"
          ><svg
            viewBox="0 0 40 40"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <path
              d="M-3 29c4-17 16-10 18-23 1-3 5-6 8-7M-1 35c8-22 19-12 21-27 1-5 5-7 10-9M1 42c10-24 22-17 24-30 1-7 6-9 16-11M10 42c8-16 19-16 20-26 1-7 5-8 13-10M19 42c4-9 15-13 16-22 1-4 5-5 9-7M-3 19C2 10 9 13 10 3"
            /></svg></span
        >Village Atlas
      </div>
      <nav id="nav"></nav>
      <button
        class="icon-btn"
        data-action="help"
        aria-label="Help"
        title="Help"
      >
        <i data-i="help"></i>
      </button>
    </header>
    <main>
      <section class="heading">
        <div>
          <div class="eyebrow">
            <span class="line"></span> VILLAGE DEVELOPMENT STUDY
          </div>
          <h1>Malkapuram explorer</h1>
          <span class="location"
            ><i data-i="pin"></i> Malkapuram, Andhra Pradesh</span
          >
        </div>
        <div class="head-actions">
          <button data-action="about"><i data-i="info"></i> About model</button
          ><button class="primary" data-action="tour">
            <i data-i="play"></i> Guided tour
          </button>
        </div>
      </section>
      <section class="workspace">
        <div id="viewport">
          <canvas
            id="scene"
            tabindex="0"
            aria-label="Interactive three-dimensional study area"
          ></canvas>
          <div id="pins"></div>
          <div id="load">Loading village model…</div>
          <div class="map-top">
            <div class="map-dropdown">
              <button id="mode" data-action="mode"></button>
              <div id="mode-menu" class="popup" hidden></div>
            </div>
            <div class="map-dropdown">
              <button data-action="layers">
                <i data-i="layers"></i> Layers
              </button>
              <div id="layer-menu" class="popup" hidden></div>
            </div>
            <button
              id="show-panel"
              class="map-icon"
              data-action="sidebar"
              aria-label="Open site overview"
            >
              <i data-i="panel"></i>
            </button>
          </div>
          <button
            id="compass"
            data-action="north"
            title="Reset north orientation"
            aria-label="Reset north orientation"
          >
            <b>N</b
            ><svg viewBox="0 0 28 36" width="19" height="25">
              <path fill="#244c3a" d="M14 1 23 32 14 26z" />
              <path fill="#aeb9ab" d="M14 1 5 32 14 26z" />
            </svg>
          </button>
          <div class="map-tools" id="map-tools"></div>
          <div id="tourbar" hidden></div>
          <div id="movement" hidden></div>
          <div class="map-foot">
            <div class="foot-left">
              <span class="stage-status"
                ><b></b> Stage 1 · Current Situation</span
              ><span id="scale"></span>
            </div>
            <span class="map-note"
              ><i data-i="mouse"></i>
              <span id="hint">Drag to orbit · Scroll to zoom</span></span
            >
          </div>
        </div>
        <aside id="side">
          <div class="aside-head">
            <span
              ><i data-i="book"></i> <b id="panel-title">Site overview</b></span
            ><button
              class="icon-btn"
              data-action="sidebar"
              title="Collapse panel"
              aria-label="Collapse panel"
            >
              <i data-i="panel"></i>
            </button>
          </div>
          <div id="side-content"></div>
        </aside>
      </section>
      <section class="timeline">
        <div class="timeline-title">
          <i data-i="timeline"></i><span>Development timeline</span>
        </div>
        <div id="stages"></div>
      </section>
    </main>
    <dialog id="dialog">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button
          autofocus
          class="icon-btn"
          data-action="close"
          aria-label="Close"
        >
          <i data-i="x"></i>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="./app.js?v=1.1"></script>
  </body>
</html>
